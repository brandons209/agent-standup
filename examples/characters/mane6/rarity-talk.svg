<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Rarity -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.9s 2.3s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:20% 0%; animation:sway 4s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 3.4s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(3deg) } 75% { transform:rotate(-3deg) } }
    .glow { animation:glow 2.2s ease-in-out infinite }
    @keyframes glow { 0%, 100% { opacity:.3 } 50% { opacity:.85 } }
    .gem { transform-box:fill-box; transform-origin:center; transform:scale(0) rotate(0); animation:twinkle 2.2s ease-in-out infinite }
    .gem.b { animation-delay:.7s } .gem.c { animation-delay:1.4s }
    @keyframes twinkle { 0%, 100% { transform:scale(0) rotate(0) } 50% { transform:scale(1) rotate(45deg) } }
  </style>
  <defs>
    <g id="coat">
      <ellipse cx="72" cy="82" rx="25" ry="16"/>
      <path d="M52 62 L66 60 L70 76 L54 80 Z"/>
      <circle cx="44" cy="46" r="22"/>
      <ellipse cx="28" cy="56" rx="13" ry="10"/>
      <rect x="50" y="86" width="9" height="27" rx="3.5"/>
      <rect x="82" y="86" width="9" height="27" rx="3.5"/>
    </g>
    <path id="farlegs" d="M61 88 h8 v23 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z M92 86 h8 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <path id="dia" d="M-3 -1.6 L-1.6 -3.2 L1.6 -3.2 L3 -1.6 L0 3.4 Z"/>
    <radialGradient id="aura"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".55" stop-color="#6fb7ef" stop-opacity=".55"/><stop offset="1" stop-color="#6fb7ef" stop-opacity="0"/></radialGradient>
    <path id="sp" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </defs>

  <g class="tail" stroke="#3b2363" stroke-width="1.6" stroke-linejoin="round">
    <path d="M93 74 C104 66 118 72 116 86 C114 96 104 96 104 104 C104 110 110 112 112 110 C108 116 96 114 96 104 C96 96 106 92 104 84 C102 78 96 78 93 74 Z" fill="#5e51a3"/>
    <path d="M104 72 C112 74 115 82 112 88 C110 84 108 78 104 76 Z" fill="#7a6cc4" stroke="none"/>
  </g>

  <use href="#farlegs" fill="#e3e4ee" stroke="#a6a8c0" stroke-width="1.6"/>
  <use href="#coat" fill="none" stroke="#a6a8c0" stroke-width="3.2" stroke-linejoin="round"/>
  <use href="#coat" fill="#f6f6fb"/>
  <ellipse cx="40" cy="38" rx="9" ry="6" fill="#fff" opacity=".9"/>

  <g transform="translate(80 79)" stroke="#2e6c9e" stroke-width=".6" stroke-linejoin="round">
    <use href="#dia" transform="translate(-4.5 -2.5) scale(1.05)" fill="#5bc0f2"/>
    <use href="#dia" transform="translate(4.5 -2.5) scale(1.05)" fill="#5bc0f2"/>
    <use href="#dia" transform="translate(0 4.5) scale(1.05)" fill="#5bc0f2"/>
  </g>

  <g class="mane" stroke="#3b2363" stroke-width="1.6" stroke-linejoin="round">
    <path d="M44 22 C60 16 74 26 72 40 C70 48 62 50 64 58 C66 64 72 66 74 64 C70 72 58 70 58 60 C58 52 66 46 64 38 C62 30 54 26 44 22 Z" fill="#5e51a3"/>
    <path d="M58 22 C66 24 72 32 70 40 C68 34 64 28 58 25 Z" fill="#7a6cc4" stroke="none"/>
  </g>

  <ellipse class="glow" cx="40" cy="12" rx="11" ry="14" fill="url(#aura)"/>
  <g stroke="#a6a8c0" stroke-width="1.4" stroke-linejoin="round">
    <path d="M35 24 L39 0 L45 22 Z" fill="#f6f6fb"/>
    <path d="M36.4 17 L42.6 14.6 M37.6 10.4 L41.6 8.8 M38.6 4.6 L40.4 4" fill="none" stroke-linecap="round"/>
  </g>

  <g class="blink">
    <ellipse cx="32" cy="45" rx="4.6" ry="8" fill="#fff" stroke="#232042" stroke-width="1.2"/>
    <ellipse cx="31" cy="47" rx="3.4" ry="5.6" fill="#2f73b6"/>
    <ellipse cx="31" cy="48" rx="1.8" ry="3.2" fill="#0d2442"/>
    <circle cx="32.4" cy="44" r="1.3" fill="#fff"/>
    <ellipse cx="48" cy="46" rx="7" ry="9.5" fill="#fff" stroke="#232042" stroke-width="1.2"/>
    <ellipse cx="46.5" cy="48" rx="5.4" ry="7.2" fill="#2f73b6"/>
    <ellipse cx="46.5" cy="51" rx="4.4" ry="3.6" fill="#78b4e6"/>
    <ellipse cx="46.5" cy="48.5" rx="2.8" ry="4.2" fill="#0d2442"/>
    <circle cx="49" cy="44" r="2" fill="#fff"/><circle cx="44.6" cy="52" r=".9" fill="#fff"/>
    <path d="M40 39.5 Q48 33 56 39.5 L59 36.5 M53 36 L55.5 33.5 M49 35 L50.5 32" fill="none" stroke="#232042" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M28 38.5 L26 36.4 M30.5 37.5 L29.5 35" fill="none" stroke="#232042" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <path d="M42 34 C45 32 50 32 53 33.5" fill="none" stroke="#5e51a3" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18.5" cy="53" r=".9" fill="#9a9cb4"/>
  <g id="mouth"><path d="M22.5 60.2 Q27.0 61.800000000000004 31.5 59.800000000000004 Q30.4 65.8 27.0 65.8 Q23.6 65.8 22.5 60.2 Z" fill="#7a2338" stroke="#232042" stroke-width="1.2" stroke-linejoin="round"/><path d="M24.5 64.2 Q27.0 62.7 29.5 64.2 Q27.0 65.9 24.5 64.2 Z" fill="#f17d8f"/></g>

  <g stroke="#3b2363" stroke-width="1.6" stroke-linejoin="round">
    <path d="M46 20 C34 16 22 24 22 36 C22 42 26 44 30 42 C28 38 28 34 32 32 C34 36 38 36 40 33 C44 34 48 30 47 26 C52 26 56 26 60 30 C60 24 54 20 46 20 Z" fill="#5e51a3"/>
    <path d="M30 26 C34 22 40 21 45 22 C40 23 35 25 32 29 Z" fill="#7a6cc4" stroke="none"/>
  </g>

  <g fill="#fff">
    <g transform="translate(30 8)"><use class="gem" href="#sp"/></g>
    <g transform="translate(50 6) scale(.8)"><use class="gem b" href="#sp"/></g>
    <g transform="translate(33 20) scale(.7)"><use class="gem c" href="#sp"/></g>
  </g>
</svg>
