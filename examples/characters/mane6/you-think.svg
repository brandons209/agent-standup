    <ellipse cx="38" cy="39.5" rx="1.8" ry="3" fill="#0f3313"/>
    <circle cx="39.4" cy="35.5" r="1.3" fill="#fff"/>
    <ellipse cx="54" cy="41" rx="7" ry="9.2" fill="#fff" stroke="#2f1848" stroke-width="1.2"/>
    <ellipse cx="53.5" cy="39.5" rx="5.4" ry="7" fill="#3aa346"/>
    <ellipse cx="53.5" cy="42.5" rx="4.4" ry="3.4" fill="#86d47a"/>
    <ellipse cx="53.5" cy="40" rx="2.8" ry="4" fill="#0f3313"/>
    <circle cx="56" cy="35.5" r="2" fill="#fff"/><circle cx="51.6" cy="43.5" r=".9" fill="#fff"/>
  </g>
  <path d="M46 30 Q53 27 60 30" fill="none" stroke="#2f1848" stroke-width="1.4" stroke-linecap="round"/>
