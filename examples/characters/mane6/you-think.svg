    <path d="M28 55 C22 50 18 54 13 49 C14 54 9 56 5 54 C8 60 4 63 2 62 C8 68 20 66 28 58 Z" fill="#45d06a" stroke="#1d8a3c" stroke-width="1" stroke-linejoin="round"/>
    <path d="M26 56 C21 54 18 56 15 54 C15 58 11 60 9 60 C14 63 21 62 26 57.5 Z" fill="#b6f5a8"/>
  </g>
  <g transform="translate(5.5 -1.5)">
  <g class="muse">
