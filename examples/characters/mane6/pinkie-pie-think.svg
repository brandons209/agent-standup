<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Pinkie Pie, thinking -->
  <style>
    .hop { animation:hop 1.6s ease-in-out infinite }
    @keyframes hop { 0%, 40%, 100% { transform:translateY(0) } 55% { transform:translateY(-4px) } 70% { transform:translateY(0) } 80% { transform:translateY(-2px) } 90% { transform:translateY(0) } }
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.1s 1.1s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .poof { transform-box:fill-box; transform-origin:50% 80%; animation:poof 1.6s ease-in-out infinite }
    @keyframes poof { 0%, 40%, 100% { transform:scale(1) } 55% { transform:scale(1.06, .95) } 70% { transform:scale(.97, 1.04) } }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 1.6s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 50% { transform:rotate(-6deg) } }
    .muse { transform-box:fill-box; transform-origin:0% 100%; animation:muse 3s ease-in-out infinite }
    @keyframes muse { 0%, 100% { transform:translateY(0) } 50% { transform:translateY(-2px) } }
    .dot { animation:dot 1.5s ease-in-out infinite } .dot.b { animation-delay:.25s } .dot.c { animation-delay:.5s }
    @keyframes dot { 0%, 100% { opacity:.35 } 50% { opacity:1 } }
  </style>
  <defs>
    <g id="coat">
      <ellipse cx="72" cy="82" rx="25" ry="16"/>
      <path d="M52 62 L66 60 L70 76 L54 80 Z"/>
      <circle cx="44" cy="46" r="22"/>
      <ellipse cx="28" cy="56" rx="13" ry="10"/>
      <rect x="50" y="86" width="9" height="27" rx="3.5"/>
      <rect x="82" y="86" width="9" height="27" rx="3.5"/>
    </g>
    <path id="farlegs" d="M61 88 h8 v23 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z M92 86 h8 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <g id="balloon"><path d="M0 3.6 Q-1.2 7 .8 9.5" fill="none" stroke="#4a3550" stroke-width=".5"/><ellipse cy="0" rx="2.8" ry="3.6"/><path d="M-.8 3.4 L0 4.4 L.8 3.4 Z"/></g>
  </defs>

  <g class="hop">
    <g class="tail" stroke="#9c1f5c" stroke-width="1.6" stroke-linejoin="round">
      <path d="M93 74 C98 66 110 66 112 74 C118 76 118 86 112 88 C116 94 112 102 106 100 C106 108 96 110 94 102 C100 98 104 92 100 86 C98 80 96 78 93 74 Z" fill="#e5228d"/>
      <path d="M104 72 C108 72 111 75 110 78 M110 86 C112 88 112 92 109 94 M102 96 C103 100 100 103 98 102" fill="none" stroke="#f45aad" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <use href="#farlegs" fill="#f2a3c7" stroke="#d26c9c" stroke-width="1.6"/>
    <use href="#coat" fill="none" stroke="#d26c9c" stroke-width="3.2" stroke-linejoin="round"/>
    <use href="#coat" fill="#f9bbd9"/>
    <ellipse cx="40" cy="38" rx="9" ry="6" fill="#fcd6e8" opacity=".9"/>

    <g transform="translate(80 77)" stroke-width=".5">
      <use href="#balloon" transform="translate(-4.5 -1)" fill="#5cc8ef" stroke="#2c88b0"/>
      <use href="#balloon" transform="translate(4.5 -1)" fill="#5cc8ef" stroke="#2c88b0"/>
      <use href="#balloon" transform="translate(0 -3.4)" fill="#fbe360" stroke="#c4a52a"/>
    </g>

    <g class="blink">
      <ellipse cx="32" cy="45" rx="4.6" ry="8" fill="#fff" stroke="#3d2140" stroke-width="1.2"/>
      <ellipse cx="32" cy="43.5" rx="3.4" ry="5.6" fill="#3e9ad7"/>
      <ellipse cx="32" cy="44.5" rx="1.8" ry="3.2" fill="#0f2e48"/>
      <circle cx="33.4" cy="40.5" r="1.3" fill="#fff"/>
      <ellipse cx="48" cy="46" rx="7" ry="9.5" fill="#fff" stroke="#3d2140" stroke-width="1.2"/>
      <ellipse cx="47.5" cy="44.5" rx="5.4" ry="7.2" fill="#3e9ad7"/>
      <ellipse cx="47.5" cy="47.5" rx="4.4" ry="3.6" fill="#8fcaf2"/>
      <ellipse cx="47.5" cy="45" rx="2.8" ry="4.2" fill="#0f2e48"/>
      <circle cx="50" cy="40.5" r="2" fill="#fff"/><circle cx="45.6" cy="48.5" r=".9" fill="#fff"/>
      <path d="M40.5 38.5 Q48 32 55.5 38.5 L57.5 36" fill="none" stroke="#3d2140" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <ellipse cx="38.5" cy="58" rx="3.6" ry="1.8" fill="#f06aa8" opacity=".45"/>
    <circle cx="18.5" cy="53" r=".9" fill="#c4578a"/>
    <g id="mouth"><path d="M22.6 61.4 Q27.5 62.4 32.6 60.4" fill="none" stroke="#3d2140" stroke-width="1.3" stroke-linecap="round"/></g>

    <path d="M56 28 L61 14 L66 30 Z" fill="#f9bbd9" stroke="#d26c9c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M59.4 26 L61 19.5 L63.6 27.6 Z" fill="#f17fb5"/>
    <g class="poof" stroke="#9c1f5c" stroke-width="1.6" stroke-linejoin="round">
      <path d="M22 42 C14 40 14 30 20 28 C16 22 22 14 30 17 C30 10 40 8 44 13 C48 7 58 9 58 16 C64 14 70 20 67 26 C74 28 74 38 68 40 C72 46 70 54 64 54 C66 62 60 68 54 66 C56 60 58 54 56 48 C54 40 50 34 44 32 C38 32 34 38 30 36 C28 40 26 44 22 42 Z" fill="#e5228d"/>
      <path d="M24 22 C27 20 30 21 31 24 M37 14 C40 12 44 13 45 16 M52 14 C56 13 59 16 58 19 M63 23 C66 24 68 27 66 30 M66 36 C68 39 68 43 65 45 M63 52 C64 55 62 58 59 59" fill="none" stroke="#f45aad" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
  <g class="muse">
    <circle cx="70" cy="22" r="1.8" fill="#fff" stroke="#8a8fa8" stroke-width="1"/>
    <circle cx="75" cy="16" r="2.8" fill="#fff" stroke="#8a8fa8" stroke-width="1"/>
    <path d="M82 13 C80 6 88 2 93 6 C96 1 105 2 106 8 C112 8 114 15 109 18 C111 23 104 26 100 23 C97 27 89 26 88 22 C82 23 79 17 82 13 Z" fill="#fff" stroke="#8a8fa8" stroke-width="1.2" stroke-linejoin="round"/>
    <circle class="dot" cx="89" cy="15" r="1.6" fill="#8a8fa8"/><circle class="dot b" cx="95.5" cy="15" r="1.6" fill="#8a8fa8"/><circle class="dot c" cx="102" cy="15" r="1.6" fill="#8a8fa8"/>
  </g>
</svg>
