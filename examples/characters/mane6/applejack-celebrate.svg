<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Applejack, celebrating -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.7s .8s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:20% 0%; animation:sway 3.8s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 3.2s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(3deg) } 75% { transform:rotate(-3deg) } }
    .hat { transform-box:fill-box; transform-origin:30% 100%; animation:tip 5s ease-in-out infinite }
    @keyframes tip { 0%, 70%, 100% { transform:rotate(0) } 78% { transform:rotate(-9deg) translateY(-2px) } 88% { transform:rotate(-9deg) translateY(-2px) } }
    .jump { transform-box:fill-box; transform-origin:50% 100%; animation:jump 1.1s ease-out infinite }
    @keyframes jump { 0%, 60%, 100% { transform:translateY(0) } 20% { transform:translateY(-4px) scaleY(1.02) } 42% { transform:translateY(0) scaleY(.98) } }
    .spark { transform-box:fill-box; transform-origin:center; transform:scale(0); animation:spk 1.4s ease-in-out infinite }
    .spark.b { animation-delay:.45s } .spark.c { animation-delay:.9s }
    @keyframes spk { 0%, 100% { transform:scale(0) } 50% { transform:scale(1) } }
  </style>
  <defs>
    <g id="coat">
      <ellipse cx="72" cy="82" rx="25" ry="16"/>
      <path d="M52 62 L66 60 L70 76 L54 80 Z"/>
      <circle cx="44" cy="46" r="22"/>
      <ellipse cx="28" cy="56" rx="13" ry="10"/>
      <rect x="50" y="86" width="9" height="27" rx="3.5"/>
      <rect x="82" y="86" width="9" height="27" rx="3.5"/>
    </g>
    <path id="farlegs" d="M61 88 h8 v23 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z M92 86 h8 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <g id="apple"><circle r="3.4" fill="#e8343b" stroke="#a51d24" stroke-width=".6"/><path d="M0 -3.2 L.6 -5.4" stroke="#6b3f1d" stroke-width=".8"/><path d="M.6 -4.6 Q3 -6 3.4 -4.2 Q1.6 -3.6 .6 -4.6 Z" fill="#4fae3c"/></g>
    <path id="sp" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </defs>

  <g class="jump">
  <g class="tail" stroke="#b08a2e" stroke-width="1.6" stroke-linejoin="round">
    <path d="M93 74 C102 72 106 80 106 88 L105 98 L101 101 L103 106 C104 110 100 114 96 112 C98 106 97 100 96 96 L97 92 C95 86 93 80 93 74 Z" fill="#fbf7a6"/>
    <path d="M100.5 96 L105.5 97 L104.6 100.8 L99.8 99.6 Z" fill="#e8343b"/>
  </g>

  <use href="#farlegs" fill="#e09a4c" stroke="#b56c22" stroke-width="1.6"/>
  <use href="#coat" fill="none" stroke="#b56c22" stroke-width="3.2" stroke-linejoin="round"/>
  <use href="#coat" fill="#f8b469"/>
  <ellipse cx="40" cy="38" rx="9" ry="6" fill="#fcd09c" opacity=".8"/>
  <g fill="#e07d33" opacity=".85"><circle cx="20" cy="56" r=".9"/><circle cx="23" cy="54" r=".9"/><circle cx="23" cy="58" r=".9"/><circle cx="36" cy="58" r=".9"/><circle cx="39" cy="56" r=".9"/><circle cx="39" cy="60" r=".9"/></g>

  <g transform="translate(80 79)"><use href="#apple" transform="translate(-4 -2)"/><use href="#apple" transform="translate(4 -2)"/><use href="#apple" transform="translate(0 4.5)"/></g>

  <g class="mane" stroke="#b08a2e" stroke-width="1.6" stroke-linejoin="round">
    <path d="M44 24 C58 20 68 28 68 40 C68 48 70 54 72 60 L68 62 L70 66 C64 64 62 56 61 50 C60 38 56 30 44 24 Z" fill="#fbf7a6"/>
    <path d="M66.6 58.6 L71.4 57.4 L72.4 61 L67.6 62.2 Z" fill="#e8343b"/>
  </g>

  <g>
    <path d="M27.4 46.6 Q32 40.6 36.6 46.6" fill="none" stroke="#4a2a12" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M41.6 47.4 Q48 39.6 54.4 47.4" fill="none" stroke="#4a2a12" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M40.5 37.6 Q48 31 55.5 37.6 L57.5 35" fill="none" stroke="#4a2a12" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="22" cy="57" rx="3.2" ry="1.8" fill="#ff8f8f" opacity=".55"/><ellipse cx="42" cy="60" rx="3" ry="1.7" fill="#ff8f8f" opacity=".55"/>
  </g>
  <circle cx="18.5" cy="53" r=".9" fill="#a8622a"/>
  <g id="mouth"><path d="M21 59.6 Q27.25 61.2 33.5 59 Q32.4 68.6 27.25 68.6 Q22.1 68.6 21 59.6 Z" fill="#7a2338" stroke="#4a2a12" stroke-width="1.2" stroke-linejoin="round"/><path d="M23.6 65.6 Q27.25 63.4 30.9 65.6 Q27.25 68.2 23.6 65.6 Z" fill="#f17d8f"/></g>

  <g stroke="#b08a2e" stroke-width="1.6" stroke-linejoin="round">
    <path d="M26 34 C30 28 38 26 44 30 C46 34 44 36 42 37 C40 33 36 31 32 33 C30 36 28 37 26 34 Z" fill="#fbf7a6"/>
  </g>

  <g class="hat" stroke="#6b4519" stroke-width="1.6" stroke-linejoin="round">
    <path d="M16 31 C24 27 40 22 58 24 C66 25 70 28 68 31 C62 29 52 29 44 30 C32 31 22 34 16 31 Z" fill="#c98a3f"/>
    <path d="M27 28 C27 18 33 10 42 10 C46 10 48 13 50 11 C55 12 58 18 58 25 C48 23 36 24 27 28 Z" fill="#c98a3f"/>
    <path d="M27.6 25.6 C38 22 48 21.6 57.8 22.6 L58 25 C48 23.4 37 24.4 27.4 28 Z" fill="#8a5a24" stroke="none"/>
  </g>
  </g>
  <g fill="#ffd34a" stroke="#c99a18" stroke-width=".5">
    <g transform="translate(12 22) scale(1.3)"><use class="spark" href="#sp"/></g>
    <g transform="translate(84 14) scale(1.6)"><use class="spark b" href="#sp"/></g>
    <g transform="translate(104 44) scale(1.2)"><use class="spark c" href="#sp"/></g>
    <g transform="translate(8 82) scale(1)"><use class="spark b" href="#sp"/></g>
  </g>
</svg>
