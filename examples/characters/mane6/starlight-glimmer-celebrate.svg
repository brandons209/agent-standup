    <path d="M-3 -2.8 L-2.3 -.9 L-.6 -.8 L-1.8 .5 L-1.4 2 L-3 1.1 L-4.6 2 L-4.2 .5 L-5.4 -.8 L-3.7 -.9 Z" fill="#fffff0"/>
  </g>

  <path d="M54 30 L61 14.6 L66 32 Z" fill="#f2c7f8" stroke="#a877c4" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M57.6 28 L60.8 20.4 L63.6 29.4 Z" fill="#dab0e9"/>

  <g class="mane" stroke="#4a2268" stroke-width="1.6" stroke-linejoin="round">
    <path d="M42 22 C58 16 71 24 71 38 C71 50 73 60 76 68 C72 68 69 66 67 63 C66 66 64 68 61 68 C63 60 62 50 61 44 C59 34 54 28 42 22 Z" fill="#69328f"/>
    <path d="M60 27 C66 33 68 44 68 56 C68 60 68 62 67 63 C66 54 65 44 62 36 Z" fill="#9be9d8" stroke="none"/>
    <path d="M65 28 C69 34 70 44 70.4 54 C70.6 58 72 63 74 66 C71 63 69.4 58 69 52 C68.6 44 67.6 36 65 28 Z" fill="#8640b4" stroke="none"/>
  </g>

  <g>
    <path d="M27.4 46.6 Q32 40.6 36.6 46.6" fill="none" stroke="#2d1847" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M41.6 47.4 Q48 39.6 54.4 47.4" fill="none" stroke="#2d1847" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M40.5 37.6 Q48 31 55.5 37.6 L57.5 35 M54 34.4 L56 32.2" fill="none" stroke="#2d1847" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="22" cy="57" rx="3.2" ry="1.8" fill="#ff8f8f" opacity=".55"/><ellipse cx="42" cy="60" rx="3" ry="1.7" fill="#ff8f8f" opacity=".55"/>
  </g>
  <circle cx="18.5" cy="53" r=".9" fill="#a877c4"/>
  <g id="mouth"><path d="M21 59.6 Q27.25 61.2 33.5 59 Q32.4 68.6 27.25 68.6 Q22.1 68.6 21 59.6 Z" fill="#7a2338" stroke="#2d1847" stroke-width="1.2" stroke-linejoin="round"/><path d="M23.6 65.6 Q27.25 63.4 30.9 65.6 Q27.25 68.2 23.6 65.6 Z" fill="#f17d8f"/></g>

  <g stroke="#4a2268" stroke-width="1.6" stroke-linejoin="round">
    <path d="M24 39 C21 26 32 17 46 17 C55 17 62 21 64 29 L58 28 L55 33 L52 28.4 L47 33.6 L44.4 28.6 L39.6 34 L37.6 29.4 L33 34.4 L31.6 30.6 C29 33 26 36 24 39 Z" fill="#69328f"/>
    <path d="M28 28.4 C35 21 47 18.6 56 20.6 C60 21.6 62.6 24.4 63.4 27.6 C55 25.6 46 25.6 38 27.4 C34.6 28 31 28.6 28 28.4 Z" fill="#9be9d8" stroke="none"/>
    <path d="M33 27.4 C42 25.6 52 25.8 61.4 28.2 L58 27.8 L55 31 L52 27.6 L47 31.6 L44.4 27.6 L39.6 32 L37.6 28.4 Z" fill="#8640b4" stroke="none"/>
  </g>

  <ellipse class="glow" cx="40" cy="12" rx="12" ry="15" fill="url(#aura)"/>
  <g stroke="#a877c4" stroke-width="1.4" stroke-linejoin="round">
    <path d="M35 24 L39 0 L45 22 Z" fill="#f2c7f8"/>
    <path d="M36.4 17 L42.6 14.6 M37.6 10.4 L41.6 8.8 M38.6 4.6 L40.4 4" fill="none" stroke-linecap="round"/>
  </g>
  </g>
  <g fill="#9be9d8" stroke="#08bab7" stroke-width=".5">
    <g transform="translate(12 22) scale(1.3)"><use class="spark" href="#sp"/></g>
    <g transform="translate(84 14) scale(1.6)"><use class="spark b" href="#sp"/></g>
    <g transform="translate(104 44) scale(1.2)"><use class="spark c" href="#sp"/></g>
    <g transform="translate(8 82) scale(1)"><use class="spark b" href="#sp"/></g>
  </g>
</svg>
