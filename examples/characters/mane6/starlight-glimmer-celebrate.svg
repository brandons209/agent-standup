<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Starlight Glimmer, celebrating -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 5.1s 2.7s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:30% 0%; animation:sway 4.2s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 3.5s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(3deg) } 75% { transform:rotate(-3deg) } }
    .glow { animation:glow 3.2s -1.6s ease-in-out infinite }
    @keyframes glow { 0%, 100% { opacity:.25 } 50% { opacity:.8 } }
    .jump { transform-box:fill-box; transform-origin:50% 100%; animation:jump 1.1s ease-out infinite }
    @keyframes jump { 0%, 60%, 100% { transform:translateY(0) } 20% { transform:translateY(-4px) scaleY(1.02) } 42% { transform:translateY(0) scaleY(.98) } }
    .spark { transform-box:fill-box; transform-origin:center; transform:scale(0); animation:spk 1.4s ease-in-out infinite }
    .spark.b { animation-delay:.45s } .spark.c { animation-delay:.9s }
    @keyframes spk { 0%, 100% { transform:scale(0) } 50% { transform:scale(1) } }
  </style>
  <defs>
    <g id="coat">
      <ellipse cx="72" cy="82" rx="25" ry="16"/>
      <path d="M52 62 L66 60 L70 76 L54 80 Z"/>
      <circle cx="44" cy="46" r="22"/>
      <ellipse cx="28" cy="56" rx="13" ry="10"/>
      <rect x="50" y="86" width="9" height="27" rx="3.5"/>
      <rect x="82" y="86" width="9" height="27" rx="3.5"/>
    </g>
    <path id="farlegs" d="M61 88 h8 v23 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z M92 86 h8 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <radialGradient id="aura"><stop offset="0" stop-color="#d4fff4"/><stop offset=".55" stop-color="#5fdcc0" stop-opacity=".55"/><stop offset="1" stop-color="#5fdcc0" stop-opacity="0"/></radialGradient>
    <path id="sp" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </defs>

  <g class="jump">
  <g class="tail" stroke="#4a2268" stroke-width="1.6" stroke-linejoin="round">
    <path d="M93 72 C106 68 114 78 114 92 C114 102 112 108 108 113 C106 109 103 108 100 110 C103 104 104 96 101 88 C99 82 96 77 93 72 Z" fill="#69328f"/>
    <path d="M99 74.6 C107 78 111 88 110 100 C108 92 105.6 85 100.4 80 Z" fill="#9be9d8" stroke="none"/>
    <path d="M104 77 C110 82 112 92 111.6 102 C110.6 96 109 89 106 83 Z" fill="#8640b4" stroke="none"/>
  </g>

  <use href="#farlegs" fill="#dab0e9" stroke="#a877c4" stroke-width="1.6"/>
  <use href="#coat" fill="none" stroke="#a877c4" stroke-width="3.2" stroke-linejoin="round"/>
  <use href="#coat" fill="#f2c7f8"/>
  <ellipse cx="40" cy="38" rx="9" ry="6" fill="#fadef9" opacity=".85"/>

  <g transform="translate(81 81)" stroke-linejoin="round">
    <path d="M-1.6 2 C2 1 6 -.6 9.6 -4 C7 1 3.6 3.6 -.6 4.6 Z" fill="#08bab7"/>
    <path d="M-1 -1.6 C2.6 -3.4 5.6 -6 7.6 -9.4 C6.6 -4.4 3.6 -1.4 0 .4 Z" fill="#9be9d8"/>
