<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Rainbow Dash , celebrating -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 3.9s 1.6s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:30% 10%; animation:sway 2.8s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 2.4s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(4deg) } 75% { transform:rotate(-4deg) } }
    .wing { transform-box:fill-box; transform-origin:100% 83%; animation:flap .5s ease-in-out infinite }
    @keyframes flap { 0%, 100% { transform:rotate(0) } 50% { transform:rotate(-30deg) } }
    .jump { transform-box:fill-box; transform-origin:50% 100%; animation:jump 1.1s ease-out infinite }
    @keyframes jump { 0%, 60%, 100% { transform:translateY(0) } 20% { transform:translateY(-4px) scaleY(1.02) } 42% { transform:translateY(0) scaleY(.98) } }
    .spark { transform-box:fill-box; transform-origin:center; transform:scale(0); animation:spk 1.4s ease-in-out infinite }
    .spark.b { animation-delay:.45s } .spark.c { animation-delay:.9s }
    @keyframes spk { 0%, 100% { transform:scale(0) } 50% { transform:scale(1) } }
  </style>
