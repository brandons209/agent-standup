<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Spike -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.5s 2s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .tail { transform-box:fill-box; transform-origin:0% 20%; animation:flick 3s ease-in-out infinite }
    @keyframes flick { 0%, 100% { transform:rotate(0) } 40% { transform:rotate(-8deg) } 55% { transform:rotate(6deg) } 70% { transform:rotate(0) } }
    .spines { transform-box:fill-box; transform-origin:50% 100%; animation:sway 3.4s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(2deg) } 75% { transform:rotate(-2deg) } }
    .flame { transform-box:fill-box; transform-origin:100% 50%; transform:scale(0); animation:burp 6s ease-out infinite }
    @keyframes burp { 0%, 80%, 100% { transform:scale(0); opacity:0 } 83% { transform:scale(1.1); opacity:1 } 92% { transform:scale(1); opacity:.9 } 97% { transform:scale(.6); opacity:0 } }
  </style>
  <defs>
    <g id="scales">
      <ellipse cx="60" cy="84" rx="20" ry="22"/>
      <circle cx="58" cy="42" r="21"/>
      <ellipse cx="40" cy="50" rx="14" ry="10.5"/>
      <rect x="45" y="94" width="13" height="20" rx="5.5"/>
      <rect x="64" y="94" width="13" height="20" rx="5.5"/>
    </g>
    <path id="spine" d="M-4 2 L0 -6 L4 2 Z"/>
  </defs>

  <g class="tail">
    <path d="M76 96 C88 104 100 104 104 94 C106 88 104 82 100 80" fill="none" stroke="#6a3a91" stroke-width="10" stroke-linecap="round"/>
    <path d="M76 96 C88 104 100 104 104 94 C106 88 104 82 100 80" fill="none" stroke="#a46fd2" stroke-width="7" stroke-linecap="round"/>
    <path d="M100 82 L94 72 L104 74 L108 66 L110 78 Z" fill="#3ab54a" stroke="#1d6b28" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <g class="spines" fill="#3ab54a" stroke="#1d6b28" stroke-width="1.4" stroke-linejoin="round">
    <use href="#spine" transform="translate(50 22) rotate(-20) scale(1.1)"/>
    <use href="#spine" transform="translate(61 20) scale(1.3)"/>
    <use href="#spine" transform="translate(71 24) rotate(25) scale(1.2)"/>
    <use href="#spine" transform="translate(77 32) rotate(55) scale(1.05)"/>
    <use href="#spine" transform="translate(79 66) rotate(80) scale(.9)"/>
    <use href="#spine" transform="translate(80 77) rotate(90) scale(.85)"/>
  </g>

  <path d="M72 36 L88 30 L82 39 L90 44 L73 47 Z" fill="#3ab54a" stroke="#1d6b28" stroke-width="1.4" stroke-linejoin="round"/>

  <use href="#scales" fill="none" stroke="#6a3a91" stroke-width="3.2" stroke-linejoin="round"/>
  <use href="#scales" fill="#a46fd2"/>
  <ellipse cx="54" cy="34" rx="9" ry="6" fill="#c39ae6" opacity=".8"/>

  <ellipse cx="57" cy="85" rx="13" ry="17" fill="#c5e88a" stroke="#8cb556" stroke-width="1"/>
  <path d="M46 78 Q57 81 68 78 M45 86 Q57 89 69 86 M47 94 Q57 97 67 94" fill="none" stroke="#8cb556" stroke-width="1" stroke-linecap="round"/>
  <g fill="#c5e88a" stroke="#6a3a91" stroke-width="1"><path d="M46 112 h4 v2 h-4 Z M51 112 h4 v2 h-4 Z M65 112 h4 v2 h-4 Z M70 112 h4 v2 h-4 Z"/></g>

  <path d="M48 68 C42 72 40 78 42 82" fill="none" stroke="#6a3a91" stroke-width="9" stroke-linecap="round"/>
  <path d="M48 68 C42 72 40 78 42 82" fill="none" stroke="#a46fd2" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 68 C76 72 78 78 76 82" fill="none" stroke="#6a3a91" stroke-width="9" stroke-linecap="round"/>
  <path d="M70 68 C76 72 78 78 76 82" fill="none" stroke="#a46fd2" stroke-width="6" stroke-linecap="round"/>

  <path d="M36 32 L40 24 L46 31 Z" fill="#3ab54a" stroke="#1d6b28" stroke-width="1.4" stroke-linejoin="round"/>

  <g class="blink">
    <ellipse cx="38" cy="40" rx="4.6" ry="7.6" fill="#fff" stroke="#2f1848" stroke-width="1.2"/>
    <ellipse cx="37" cy="42" rx="3.4" ry="5.3" fill="#3aa346"/>
    <ellipse cx="37" cy="43" rx="1.8" ry="3" fill="#0f3313"/>
    <circle cx="38.4" cy="39" r="1.3" fill="#fff"/>
