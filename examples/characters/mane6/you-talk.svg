    <ellipse cx="52.5" cy="46" rx="4.4" ry="3.4" fill="#86d47a"/>
    <ellipse cx="52.5" cy="43.5" rx="2.8" ry="4" fill="#0f3313"/>
    <circle cx="55" cy="39" r="2" fill="#fff"/><circle cx="50.6" cy="47" r=".9" fill="#fff"/>
  </g>
  <path d="M46 31.5 Q53 28.5 60 31.5" fill="none" stroke="#2f1848" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="29" cy="46" r="1" fill="#6a3a91"/>
  <g id="mouth"><path d="M30 53.6 Q38.5 55.2 47 53.2 Q45.0 61.1 38.5 61.1 Q32.0 61.1 30 53.6 Z" fill="#7a2338" stroke="#2f1848" stroke-width="1.2" stroke-linejoin="round"/><path d="M33.7 59.0 Q38.5 57.0 43.3 59.0 Q38.5 61.2 33.7 59.0 Z" fill="#f17d8f"/><path d="M40.9 54.5 L41.9 57.0 L42.9 54.300000000000004" fill="#fff" stroke="#2f1848" stroke-width=".6" stroke-linejoin="round"/></g>

  <g class="flame">
    <path d="M28 55 C22 50 18 54 13 49 C14 54 9 56 5 54 C8 60 4 63 2 62 C8 68 20 66 28 58 Z" fill="#45d06a" stroke="#1d8a3c" stroke-width="1" stroke-linejoin="round"/>
    <path d="M26 56 C21 54 18 56 15 54 C15 58 11 60 9 60 C14 63 21 62 26 57.5 Z" fill="#b6f5a8"/>
  </g>
</svg>
