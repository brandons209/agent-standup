<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Trixie, celebrating -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.4s 1.1s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:30% 0%; animation:sway 3.7s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 3.3s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(3deg) } 75% { transform:rotate(-3deg) } }
    .cape { transform-box:fill-box; transform-origin:0% 0%; animation:flutter 2.6s ease-in-out infinite }
    @keyframes flutter { 0%, 100% { transform:skewX(0) scaleY(1) } 35% { transform:skewX(-5deg) scaleY(.98) } 65% { transform:skewX(3deg) scaleY(1.01) } }
    .star { animation:tw 2.9s ease-in-out infinite } .star.b { animation-delay:.9s } .star.c { animation-delay:1.8s }
    .hat.star { animation-delay:.45s } .hat.star.b { animation-delay:1.35s } .hat.star.c { animation-delay:2.25s }
    @keyframes tw { 0%, 100% { opacity:1 } 50% { opacity:.35 } }
    .jump { transform-box:fill-box; transform-origin:50% 100%; animation:jump 1.1s ease-out infinite }
    @keyframes jump { 0%, 60%, 100% { transform:translateY(0) } 20% { transform:translateY(-4px) scaleY(1.02) } 42% { transform:translateY(0) scaleY(.98) } }
    .spark { transform-box:fill-box; transform-origin:center; transform:scale(0); animation:spk 1.4s ease-in-out infinite }
    .spark.b { animation-delay:.45s } .spark.c { animation-delay:.9s }
    @keyframes spk { 0%, 100% { transform:scale(0) } 50% { transform:scale(1) } }
  </style>
