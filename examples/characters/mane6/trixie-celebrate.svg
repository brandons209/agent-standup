    <path id="st" d="M0 -3 L.9 -1 L3 -.9 L1.4 .5 L1.9 2.6 L0 1.5 L-1.9 2.6 L-1.4 .5 L-3 -.9 L-.9 -1 Z"/>
  </defs>

