    <path d="M36 27 C44 21 62 21 74 26 C77 27.4 77 30 74 30 C62 27 48 27 38 30.4 C35 31.4 34 28.6 36 27 Z" fill="#9c82da"/>
    <path d="M45.6 23.4 C54 22 62 22.6 69.4 25.2 L69.8 27 C62 25 54 24.4 45 25.2 Z" fill="#7b5ace" stroke="none"/>
    <g stroke="none"><use class="hat star" href="#st" x="59" y="15" fill="#faf99d"/><use class="hat star c" href="#st" x="66" y="7" fill="#82ddf4" transform="translate(66 7) scale(.7) translate(-66 -7)"/><use class="hat star b" href="#st" x="52" y="21.6" fill="#d8eefb" transform="translate(52 21.6) scale(.7) translate(-52 -21.6)"/></g>
  </g>

  <g stroke="#2c7bb4" stroke-width="1.4" stroke-linejoin="round">
    <path d="M35 24 L39 2 L45 22 Z" fill="#6cb2ea"/>
    <path d="M36.4 17 L42.6 14.6 M37.6 10.4 L41.6 8.8" fill="none" stroke-linecap="round"/>
  </g>
  </g>
  <g stroke="#7b5ace" stroke-width=".4">
