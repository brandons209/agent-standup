    <path id="farlegs" d="M61 88 h8 v23 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z M92 86 h8 v25 a3.5 3.5 0 0 1 -3.5 3.5 h-1 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <path id="hoof" d="M0 0 h9 v3.5 a3.5 3.5 0 0 1 -3.5 3.5 h-2 a3.5 3.5 0 0 1 -3.5 -3.5 Z"/>
    <path id="hoofs" d="M3 1.2 v4.4 M5.6 1.2 v4.4" fill="none" stroke="#eefaff" stroke-width=".9" stroke-linecap="round"/>
    <pattern id="hair" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(14)">
      <rect width="14" height="14" fill="#f98b2f"/><rect x="5" width="3.6" height="14" fill="#fdbb72"/><rect x="8.6" width="3" height="14" fill="#fff0bf"/>
    </pattern>
  </defs>

