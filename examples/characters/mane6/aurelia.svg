<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Aurelia -->
  <style>
    .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.6s 2.2s infinite }
    @keyframes blink { 0%, 92%, 100% { transform:scaleY(1) } 95% { transform:scaleY(.1) } }
    .mane { transform-box:fill-box; transform-origin:30% 0%; animation:sway 3s ease-in-out infinite }
    .tail { transform-box:fill-box; transform-origin:0% 0%; animation:sway 2.5s ease-in-out infinite }
    @keyframes sway { 0%, 100% { transform:rotate(0) } 25% { transform:rotate(3deg) } 75% { transform:rotate(-3deg) } }
    .scoop { transform-box:fill-box; transform-origin:30% 20%; animation:wobble 3.3s ease-in-out infinite }
    .scoop.b { animation-delay:.35s } .scoop.c { animation-delay:.7s }
    @keyframes wobble { 0%, 30%, 100% { transform:scale(1) } 8% { transform:scale(1.07, .93) } 16% { transform:scale(.96, 1.04) } 23% { transform:scale(1.02, .98) } }
    .bow { transform-box:fill-box; transform-origin:50% 55%; animation:wiggle 5.2s ease-in-out infinite }
    @keyframes wiggle { 0%, 78%, 100% { transform:rotate(0) } 83% { transform:rotate(-9deg) } 88% { transform:rotate(7deg) } 93% { transform:rotate(-3deg) } }
  </style>
  <defs>
